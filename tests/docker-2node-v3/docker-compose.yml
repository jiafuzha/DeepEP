# ===========================================================================
# Docker Compose: 2-Node DeepEP Internode (NORMAL path) Simulation  -- v3
#
# Like v2 but for GPUs 4-7 + NICs mlx5_4..7 (the HIGHER 4-GPU slice on 8-GPU
# hosts).  Built on the same isolated `deepep_jiafuzha` image foundation.
#
# Simulates 2 physical nodes, each with 2 GPUs + 2 NICs:
#   deepep-v3-node0: GPUs 4,5 + NICs mlx5_4,mlx5_5  (SSH 127.0.0.1:2330)
#   deepep-v3-node1: GPUs 6,7 + NICs mlx5_6,mlx5_7  (SSH 127.0.0.1:2331)
#
# Host networking is used: RoCE GID tables are zeroed inside bridge-network
# containers, which breaks iSHMEM IBGDA address-handle creation.
# ===========================================================================

x-common: &common
  build:
    context: ../../docker
    dockerfile: Dockerfile
  image: ${IMAGE_NAME:-deepep_jiafuzha}
  privileged: true
  network_mode: host
  cap_add:
    - IPC_LOCK
  shm_size: '16gb'
  ulimits:
    memlock:
      soft: -1
      hard: -1
  working_dir: /root/jiafuzha
  volumes:
    - /root/jiafuzha:/root/jiafuzha:rw
    - /sys/bus/pci/devices:/sys/bus/pci/devices:ro
    - /sys/class/drm:/sys/class/drm:ro
    - /sys/class/infiniband:/sys/class/infiniband:ro
    - /sys/devices:/sys/devices:ro
    - /tmp/deepep-docker-ssh:/tmp/ssh-keys:ro
  devices:
    - /dev/dri:/dev/dri
    - /dev/infiniband:/dev/infiniband
    - /dev/igub_vmem:/dev/igub_vmem
  environment: &common-env
    no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    ISHMEM_DIR: ${ISHMEM_DIR:-/root/jiafuzha/ishmem_ibgda/build/_install}
    MASTER_ADDR: ${MASTER_ADDR:-deepep-v3-node0}

services:
  node0:
    <<: *common
    entrypoint: ""
    container_name: deepep-v3-node0
    hostname: deepep-v3-node0
    extra_hosts:
      - "deepep-v3-node0:127.0.0.1"
      - "deepep-v3-node1:127.0.0.1"
    environment:
      <<: *common-env
      SIM_NODE_RANK: "0"
      # GPU 4,5 + NICs mlx5_4,mlx5_5 (PCIe domain 0x9x/0xa0)
      ZE_AFFINITY_MASK: ${NODE0_ZE_AFFINITY_MASK:-4,5}
      NODE_MLX5_HCAS: ${NODE0_MLX5_HCAS:-mlx5_4,mlx5_5}
      NODE_IB_IFACES: ${NODE0_IB_IFACES:-ens910f0np0,ens910f1np1}
      SSHD_PORT: "2330"
    command: >
      bash -c "
        mkdir -p /root/.ssh /var/run/sshd &&
        printenv | grep -E '^(SIM_NODE_RANK|ZE_AFFINITY_MASK|NODE_MLX5_HCAS|NODE_IB_IFACES)=' | sed 's/^/export /' > /run/deepep_node_env &&
        ssh-keygen -A >/dev/null 2>&1 &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        sed -i 's/#\\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        /usr/sbin/sshd -p 2330 &&
        echo 'deepep-v3-node0 ready (hostname=deepep-v3-node0, SSH 127.0.0.1:2330)' &&
        sleep infinity
      "

  node1:
    <<: *common
    entrypoint: ""
    container_name: deepep-v3-node1
    hostname: deepep-v3-node1
    extra_hosts:
      - "deepep-v3-node0:127.0.0.1"
      - "deepep-v3-node1:127.0.0.1"
    environment:
      <<: *common-env
      SIM_NODE_RANK: "1"
      # GPU 6,7 + NICs mlx5_6,mlx5_7 (PCIe domain 0xbx/0xc0)
      ZE_AFFINITY_MASK: ${NODE1_ZE_AFFINITY_MASK:-6,7}
      NODE_MLX5_HCAS: ${NODE1_MLX5_HCAS:-mlx5_6,mlx5_7}
      NODE_IB_IFACES: ${NODE1_IB_IFACES:-ens911f0np0,ens911f1np1}
      SSHD_PORT: "2331"
    command: >
      bash -c "
        mkdir -p /root/.ssh /var/run/sshd &&
        printenv | grep -E '^(SIM_NODE_RANK|ZE_AFFINITY_MASK|NODE_MLX5_HCAS|NODE_IB_IFACES)=' | sed 's/^/export /' > /run/deepep_node_env &&
        ssh-keygen -A >/dev/null 2>&1 &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        sed -i 's/#\\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        /usr/sbin/sshd -p 2331 &&
        echo 'deepep-v3-node1 ready (hostname=deepep-v3-node1, SSH 127.0.0.1:2331)' &&
        sleep infinity
      "