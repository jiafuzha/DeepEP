# ===========================================================================
# Docker Compose: 2-Node DeepEP Internode (NORMAL path) Simulation  -- v2
#
# Recreated on the isolated `docker/` image foundation. Unlike the original
# tests/docker-2node sim, this one does NOT bind-mount the host RDMA/verbs
# userspace (libibverbs, rdma-core, /etc/libibverbs.d), the host oneAPI, host
# conda or the blanket /dev. Those all live INSIDE the self-contained
# `deepep_jiafuzha` image (built from docker/Dockerfile), so the containers only
# see:
#   * the single /root/jiafuzha workspace (source trees built at runtime)
#   * narrowed, read-only PCIe/GPU/IB sysfs
#   * exactly the devices they need (/dev/dri, /dev/infiniband, /dev/igub_vmem)
#
# Simulates 2 physical nodes, each with 2 GPUs + 2 NICs (defaults = smc26):
#   deepep-v2-node0: GPUs 0,1 + NICs mlx5_0,mlx5_1  (SSH 127.0.0.1:2320)
#   deepep-v2-node1: GPUs 2,3 + NICs mlx5_2,mlx5_3  (SSH 127.0.0.1:2321)
#
# Host networking is used on purpose: RoCE GID tables are zeroed inside
# bridge-network containers, which breaks iSHMEM IBGDA address-handle creation.
# Host networking preserves the real NIC/GID state while the two simulated nodes
# stay distinct by hostname / SSH port and by their env-driven GPU+NIC slice.
# ===========================================================================

x-common: &common
  build:
    context: ../../docker
    dockerfile: Dockerfile
  image: ${IMAGE_NAME:-deepep_jiafuzha}
  privileged: true
  network_mode: host
  cap_add:
    - IPC_LOCK
  # Private per-container IPC namespace (do NOT use ipc: host). Each simulated
  # node gets its own /dev/shm, matching a real cluster and preventing the two
  # "nodes" from colliding on PSM3/oneCCL/MPI shm segments + named semaphores.
  shm_size: '16gb'
  ulimits:
    memlock:
      soft: -1
      hard: -1
  working_dir: /root/jiafuzha
  volumes:
    # --- Single workspace mount (source trees built at runtime per docker/Dockerfile) ---
    - /root/jiafuzha:/root/jiafuzha:rw
    # NOTE: the patched NEO (UC UAR) bind-mount was REMOVED (2026-07-08): forcing the
    # NIC UAR page UC regressed LL to a GPU compute wedge; stock runtime is the good config.
    # --- Narrowed, read-only sysfs for PCIe/GPU/IB topology discovery ---
    - /sys/bus/pci/devices:/sys/bus/pci/devices:ro
    - /sys/class/drm:/sys/class/drm:ro
    - /sys/class/infiniband:/sys/class/infiniband:ro
    - /sys/devices:/sys/devices:ro
    # --- SSH keys for the cross-container mpirun launcher ---
    - /tmp/deepep-docker-ssh:/tmp/ssh-keys:ro
  devices:
    - /dev/dri:/dev/dri
    - /dev/infiniband:/dev/infiniband
    - /dev/igub_vmem:/dev/igub_vmem
  environment: &common-env
    no_proxy: ${NO_PROXY:-localhost,127.0.0.1}
    http_proxy: ${http_proxy:-}
    https_proxy: ${https_proxy:-}
    ISHMEM_DIR: ${ISHMEM_DIR:-/root/jiafuzha/ishmem_ibgda/build/_install}
    MASTER_ADDR: ${MASTER_ADDR:-deepep-v2-node0}

services:
  node0:
    <<: *common
    container_name: deepep-v2-node0
    hostname: deepep-v2-node0
    extra_hosts:
      - "deepep-v2-node0:127.0.0.1"
      - "deepep-v2-node1:127.0.0.1"
    environment:
      <<: *common-env
      SIM_NODE_RANK: "0"
      # Per-node GPU + NIC slice (env-driven, overridable). Defaults = smc26.
      ZE_AFFINITY_MASK: ${NODE0_ZE_AFFINITY_MASK:-0,1}
      NODE_MLX5_HCAS: ${NODE0_MLX5_HCAS:-mlx5_0,mlx5_1}
      NODE_IB_IFACES: ${NODE0_IB_IFACES:-ens1006f0np0,ens1006f1np1}
      SSHD_PORT: "2320"
    command: >
      bash -c "
        mkdir -p /root/.ssh /var/run/sshd &&
        printenv | grep -E '^(SIM_NODE_RANK|ZE_AFFINITY_MASK|NODE_MLX5_HCAS|NODE_IB_IFACES)=' | sed 's/^/export /' > /run/deepep_node_env &&
        ssh-keygen -A >/dev/null 2>&1 &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        sed -i 's/#\\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        /usr/sbin/sshd -p 2320 &&
        echo 'deepep-v2-node0 ready (hostname=deepep-v2-node0, SSH 127.0.0.1:2320)' &&
        sleep infinity
      "

  node1:
    <<: *common
    container_name: deepep-v2-node1
    hostname: deepep-v2-node1
    extra_hosts:
      - "deepep-v2-node0:127.0.0.1"
      - "deepep-v2-node1:127.0.0.1"
    environment:
      <<: *common-env
      SIM_NODE_RANK: "1"
      ZE_AFFINITY_MASK: ${NODE1_ZE_AFFINITY_MASK:-2,3}
      NODE_MLX5_HCAS: ${NODE1_MLX5_HCAS:-mlx5_2,mlx5_3}
      NODE_IB_IFACES: ${NODE1_IB_IFACES:-ens2005f0np0,ens2005f1np1}
      SSHD_PORT: "2321"
    command: >
      bash -c "
        mkdir -p /root/.ssh /var/run/sshd &&
        printenv | grep -E '^(SIM_NODE_RANK|ZE_AFFINITY_MASK|NODE_MLX5_HCAS|NODE_IB_IFACES)=' | sed 's/^/export /' > /run/deepep_node_env &&
        ssh-keygen -A >/dev/null 2>&1 &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        sed -i 's/#\\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config &&
        /usr/sbin/sshd -p 2321 &&
        echo 'deepep-v2-node1 ready (hostname=deepep-v2-node1, SSH 127.0.0.1:2321)' &&
        sleep infinity
      "
