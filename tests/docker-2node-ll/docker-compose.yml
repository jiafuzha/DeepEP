# ===========================================================================
# Docker Compose: 2-Node DeepEP Internode LOW-LATENCY Simulation
#
# Simulates 2 physical nodes, each with 2 GPUs + 2 NICs:
# for smc26
#   deepep-ll-node0: GPUs 0,1 + NICs mlx5_0,mlx5_1  (172.31.1.10)
#   deepep-ll-node1: GPUs 2,3 + NICs mlx5_2,mlx5_3  (172.31.1.11)
# for 140
#   deepep-ll-node0: GPUs 4,5 + NICs mlx5_4,mlx5_5  (SSH on 127.0.0.1:2310)
#   deepep-ll-node1: GPUs 6,7 + NICs mlx5_6,mlx5_7  (SSH on 127.0.0.1:2311)
#
# Distinct identity (deepep-ll-* with ports 2310/2311) from the normal-path
# docker-2node sim so the two compose projects do not collide; they share the
# same physical GPUs/NICs and must not run at once.
#
# Uses host networking instead of a private bridge. In this environment, RoCE
# GID tables are zeroed inside bridge-network containers, which breaks iSHMEM
# IBGDA address-handle creation. Host networking preserves the real NIC/GID
# state while still keeping the two simulated nodes distinct by SSH port/name.
# ===========================================================================

x-common: &common
  image: jiafuzha-ishmem-ibgda:latest
  privileged: true
  # NOTE: do NOT use `ipc: host`. This is a 2-NODE SIMULATION on one physical
  # host; `ipc: host` shares /dev/shm + SysV IPC across BOTH simulated nodes and
  # the host, so the two "nodes" collide on shared-memory IPC objects (MPI shm:
  # fabric, oneCCL/xccl intra-node shm, and PSM3 NIC-affinity shm/semaphores).
  # Worse, a SIGKILL'd run (timeout/DEVICE_LOST) leaks PSM3's named semaphore
  # (sem.psm3_nic_affinity_shm_rw_mutex) into the shared, persistent /dev/shm,
  # and the next run blocks forever acquiring it -> intermittent bootstrap hang.
  # A private per-container IPC namespace gives each simulated node its own
  # /dev/shm (matching a real cluster) and is cleared on container restart.
  # Within-node Level-Zero IPC uses dma-buf FD passing (SCM_RIGHTS over Unix
  # sockets), which is IPC-namespace-independent, so this does not break it.
  shm_size: '16gb'
  # The blanket `/dev:/dev` mount below shares the host's /dev/shm into both
  # containers; layer a private tmpfs over /dev/shm so each simulated node has
  # its own POSIX-shm namespace (PSM3/oneCCL/MPI segments + named semaphores).
  tmpfs:
    - /dev/shm:exec,size=16g
  ulimits:
    memlock:
      soft: -1
      hard: -1
  volumes:
    # --- Shared environments ---
    - /opt/intel/oneapi:/opt/intel/oneapi:ro
    - /root/miniforge3:/root/miniforge3:ro
    - /root/.conda:/root/.conda:ro

    # --- Code repos (read-write) ---
    # for smc26
    - /root/jiafuzha/code-repo/ishmem_ibgda:/data/jiafuzha/ishmem_ibgda:rw
    - /root/jiafuzha/ishmem_ibgda:/root/jiafuzha/ishmem_ibgda:rw
    - /root/jiafuzha/code-repo/ishmem_ibgda:/root/jiafuzha/code-repo/ishmem_ibgda:rw
    # Selected ishmem_ibgda repo root (the tree ISHMEM_DIR lives in). run.sh
    # derives ISHMEM_HOST_ROOT from ISHMEM_DIR (strips /build/_install) and
    # exports it before `docker compose up`, so switching ISHMEM_DIR to a repo
    # not already bind-mounted above still mounts that tree at the SAME host path
    # in-container (required for the in-container nic_pcie_check pkg-config build).
    # Defaults to /root/jiafuzha/ishmem_ibgda (matches the ISHMEM_DIR default).
    - ${ISHMEM_HOST_ROOT:-/root/jiafuzha/ishmem_ibgda}:${ISHMEM_HOST_ROOT:-/root/jiafuzha/ishmem_ibgda}:rw
    # for 140
    # - /root/jiafuzha/ishmem_ibgda:/data/jiafuzha/ishmem_ibgda:rw
    # - /root/jiafuzha/ishmem_ibgda:/root/jiafuzha/ishmem_ibgda:rw
    - /root/jiafuzha/code-repo/zjf2012/DeepEP:/root/jiafuzha/code-repo/zjf2012/DeepEP:rw
    - /root/jiafuzha/code-repo/pytorch:/root/jiafuzha/code-repo/pytorch:rw
    - /root/jiafuzha/code-repo/intel_gpu_uar_bridge:/root/jiafuzha/code-repo/intel_gpu_uar_bridge:rw

    # --- System (RDMA, GPU sysfs) ---
    - /sys:/sys:ro
    - /etc/libibverbs.d:/etc/libibverbs.d:ro
    - /dev:/dev
    - /usr/bin/kmod:/usr/bin/kmod:ro
    - /lib/modules:/lib/modules:ro

    # --- Host RDMA/GPU libraries ---
    - /lib/x86_64-linux-gnu:/host-libs:ro
    - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro

    # --- SSH keys ---
    - /tmp/deepep-docker-ssh:/tmp/ssh-keys:ro

services:
  node0:
    <<: *common
    container_name: deepep-ll-node0
    hostname: deepep-ll-node0
    network_mode: host
    extra_hosts:
      - "deepep-ll-node0:127.0.0.1"
      - "deepep-ll-node1:127.0.0.1"
    environment:
      # for smc26
      - ZE_AFFINITY_MASK=0,1
      # for 140
      # - ISHMEM_DIR=/root/jiafuzha/ishmem_ibgda/build/_install
      # - ZE_AFFINITY_MASK=4,5
      - NODE_ID=0
      - LD_LIBRARY_PATH=/root/jiafuzha/ishmem_ibgda/build/_install/lib:/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/intel/oneapi/lib:/host-libs
    command: >
      bash -c "
        ln -sf /usr/bin/kmod /usr/sbin/insmod 2>/dev/null;
        ln -sf /usr/bin/kmod /usr/sbin/lsmod 2>/dev/null;
        insmod /root/jiafuzha/code-repo/intel_gpu_uar_bridge/driver/igub_vmem_drv.ko 2>/dev/null || true;
        mkdir -p /root/.ssh /var/run/sshd &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        /usr/sbin/sshd -p 2310 &&
        echo 'deepep-ll-node0 ready (hostname=deepep-ll-node0, SSH 127.0.0.1:2310)' &&
        sleep infinity
      "

  node1:
    <<: *common
    container_name: deepep-ll-node1
    hostname: deepep-ll-node1
    network_mode: host
    extra_hosts:
      - "deepep-ll-node0:127.0.0.1"
      - "deepep-ll-node1:127.0.0.1"
    environment:
      # for smc26
      - ZE_AFFINITY_MASK=2,3
      # for 140
      # - ISHMEM_DIR=/root/jiafuzha/ishmem_ibgda/build/_install
      # - ZE_AFFINITY_MASK=6,7
      - NODE_ID=1
      - LD_LIBRARY_PATH=/root/jiafuzha/ishmem_ibgda/build/_install/lib:/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/intel/oneapi/lib:/host-libs
    command: >
      bash -c "
        ln -sf /usr/bin/kmod /usr/sbin/insmod 2>/dev/null;
        ln -sf /usr/bin/kmod /usr/sbin/lsmod 2>/dev/null;
        insmod /root/jiafuzha/code-repo/intel_gpu_uar_bridge/driver/igub_vmem_drv.ko 2>/dev/null || true;
        mkdir -p /root/.ssh /var/run/sshd &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        /usr/sbin/sshd -p 2311 &&
        echo 'deepep-ll-node1 ready (hostname=deepep-ll-node1, SSH 127.0.0.1:2311)' &&
        sleep infinity
      "
