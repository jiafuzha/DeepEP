# ===========================================================================
# Docker Compose: 2-Node DeepEP Internode LOW-LATENCY Simulation
#
# Simulates 2 physical nodes, each with 2 GPUs + 2 NICs:
#   deepep-ll-node0: GPUs 4,5 + NICs mlx5_4,mlx5_5  (172.31.1.10)
#   deepep-ll-node1: GPUs 6,7 + NICs mlx5_6,mlx5_7  (172.31.1.11)
#
# Distinct identity (deepep-ll-*, 172.31.1.0/24, ports 2310/2311, deepep-ll-net)
# from the normal-path docker-2node sim so the two compose projects do not
# collide; they share the same physical GPUs/NICs and must not run at once.
#
# Uses a private bridge network so each container has its own hostname and
# IP - MPI then treats them as TWO real nodes (correct PPN, MPI_LOCALRANKID).
# RDMA/verbs work via bind-mounted /dev/infiniband and /sys (privileged).
# ===========================================================================

x-common: &common
  image: jiafuzha-ishmem-ibgda:latest
  privileged: true
  # NOTE: do NOT use `ipc: host`. This is a 2-NODE SIMULATION on one physical
  # host; `ipc: host` shares /dev/shm + SysV IPC across BOTH simulated nodes and
  # the host, so the two "nodes" collide on shared-memory IPC objects (MPI shm:
  # fabric, oneCCL/xccl intra-node shm, and PSM3 NIC-affinity shm/semaphores).
  # Worse, a SIGKILL'd run (timeout/DEVICE_LOST) leaks PSM3's named semaphore
  # (sem.psm3_nic_affinity_shm_rw_mutex) into the shared, persistent /dev/shm,
  # and the next run blocks forever acquiring it -> intermittent bootstrap hang.
  # A private per-container IPC namespace gives each simulated node its own
  # /dev/shm (matching a real cluster) and is cleared on container restart.
  # Within-node Level-Zero IPC uses dma-buf FD passing (SCM_RIGHTS over Unix
  # sockets), which is IPC-namespace-independent, so this does not break it.
  shm_size: '16gb'
  # The blanket `/dev:/dev` mount below shares the host's /dev/shm into both
  # containers; layer a private tmpfs over /dev/shm so each simulated node has
  # its own POSIX-shm namespace (PSM3/oneCCL/MPI segments + named semaphores).
  tmpfs:
    - /dev/shm:exec,size=16g
  ulimits:
    memlock:
      soft: -1
      hard: -1
  volumes:
    # --- Shared environments ---
    - /opt/intel/oneapi:/opt/intel/oneapi:ro
    - /root/miniforge3:/root/miniforge3:ro
    - /root/.conda:/root/.conda:ro

    # --- Code repos (read-write) ---
    - /data/jiafuzha/ishmem_ibgda:/data/jiafuzha/ishmem_ibgda:rw
    - /data/jiafuzha/ishmem_ibgda:/root/jiafuzha/ishmem_ibgda:rw
    - /root/jiafuzha/code-repo/zjf2012/DeepEP:/root/jiafuzha/code-repo/zjf2012/DeepEP:rw
    - /data/jiafuzha/code-repo/zjf2012/DeepEP:/data/jiafuzha/code-repo/zjf2012/DeepEP:rw
    - /root/jiafuzha/code-repo/pytorch:/root/jiafuzha/code-repo/pytorch:rw
    - /root/jiafuzha/code-repo/intel_gpu_uar_bridge:/root/jiafuzha/code-repo/intel_gpu_uar_bridge:rw

    # --- iSHMEM 2026 shim (used by DeepEP at link/runtime) ---
    - /root/.copilot/session-state/d757e418-b21f-4f96-8d86-d872b34e7e42/files/ishmem-2026-shim:/root/.copilot/session-state/d757e418-b21f-4f96-8d86-d872b34e7e42/files/ishmem-2026-shim:ro

    # --- System (RDMA, GPU sysfs) ---
    - /sys:/sys:ro
    - /etc/libibverbs.d:/etc/libibverbs.d:ro
    - /dev:/dev
    - /usr/bin/kmod:/usr/bin/kmod:ro
    - /lib/modules:/lib/modules:ro

    # --- Host RDMA/GPU libraries ---
    - /lib/x86_64-linux-gnu:/host-libs:ro
    - /usr/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:ro

    # --- SSH keys ---
    - /tmp/deepep-docker-ssh:/tmp/ssh-keys:ro

services:
  node0:
    <<: *common
    container_name: deepep-ll-node0
    hostname: deepep-ll-node0
    networks:
      deepep-ll-net:
        ipv4_address: 172.31.1.10
    ports:
      - "2310:22"
    extra_hosts:
      - "deepep-ll-node0:172.31.1.10"
      - "deepep-ll-node1:172.31.1.11"
    environment:
      - ZE_AFFINITY_MASK=4,5
      - NODE_ID=0
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/intel/oneapi/lib:/host-libs
    command: >
      bash -c "
        ln -sf /usr/bin/kmod /usr/sbin/insmod 2>/dev/null;
        ln -sf /usr/bin/kmod /usr/sbin/lsmod 2>/dev/null;
        insmod /root/jiafuzha/code-repo/intel_gpu_uar_bridge/driver/igub_vmem_drv.ko 2>/dev/null || true;
        mkdir -p /root/.ssh /var/run/sshd &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        /usr/sbin/sshd -p 22 &&
        echo 'deepep-ll-node0 ready (hostname=deepep-ll-node0, IP=172.31.1.10, SSH 22)' &&
        sleep infinity
      "

  node1:
    <<: *common
    container_name: deepep-ll-node1
    hostname: deepep-ll-node1
    networks:
      deepep-ll-net:
        ipv4_address: 172.31.1.11
    ports:
      - "2311:22"
    extra_hosts:
      - "deepep-ll-node0:172.31.1.10"
      - "deepep-ll-node1:172.31.1.11"
    environment:
      - ZE_AFFINITY_MASK=6,7
      - NODE_ID=1
      - LD_LIBRARY_PATH=/lib/x86_64-linux-gnu:/usr/lib/x86_64-linux-gnu:/opt/intel/oneapi/lib:/host-libs
    command: >
      bash -c "
        ln -sf /usr/bin/kmod /usr/sbin/insmod 2>/dev/null;
        ln -sf /usr/bin/kmod /usr/sbin/lsmod 2>/dev/null;
        insmod /root/jiafuzha/code-repo/intel_gpu_uar_bridge/driver/igub_vmem_drv.ko 2>/dev/null || true;
        mkdir -p /root/.ssh /var/run/sshd &&
        cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa &&
        cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/authorized_keys &&
        cp /tmp/ssh-keys/config /root/.ssh/config &&
        chmod 600 /root/.ssh/id_rsa /root/.ssh/authorized_keys /root/.ssh/config &&
        /usr/sbin/sshd -p 22 &&
        echo 'deepep-ll-node1 ready (hostname=deepep-ll-node1, IP=172.31.1.11, SSH 22)' &&
        sleep infinity
      "

networks:
  deepep-ll-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.1.0/24
